#
# Runs the real ingest of signed messages against streams from simulated technician nodes with injected faults (replays,
# tampering, a wrong secret, clock skew, a wrong destination) and a fixed seed: no node, no network, no hardware. A second job
# measures the coverage of the test suite and fails under a floor that must not go down.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 3"

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated message streams with injected faults
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the node with the test extras
        run: python -m pip install ".[dev,sdk]"
      - name: Run the simulated streams, the evidence checks and the approval gate
        run: PYTHONPATH=src python -m pytest tests/test_simulation_ingest.py tests/test_evidence.py tests/test_branches_approvals_schema_transport.py -q

  coverage:
    name: Measure coverage and keep the floor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the node with the test extras and coverage
        run: python -m pip install ".[dev,sdk]" coverage
      - name: Run the tests under coverage (statements and branches)
        run: PYTHONPATH=src python -m coverage run --branch --source=src/hydra_umc_developer_node -m pytest tests -q
      - name: Report the coverage and fail under the floor
        run: python -m coverage report -m --fail-under=90
